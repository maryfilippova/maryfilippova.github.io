<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gap:3px;--cols:5;--accent:#00a0ff}
html,body{min-height:100vh;font-family:system-ui,sans-serif;background:#fff;color:#1a1a1a}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}

/* ── HEADER ── */
.site-header{padding:20px 32px 0;border-bottom:1px solid #eee}
.sh-top{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:14px}
.sh-name{font-size:22px;font-weight:700;line-height:1}
.sh-sub{font-size:13px;color:#777;margin-top:3px}
.sh-edit-btn{font-size:12px;color:#aaa;border:none;background:none;padding:6px 10px;border:1px solid #e0e0e0;border-radius:4px}
.sh-edit-btn:hover{color:#333;border-color:#bbb}
.tabs{display:flex;gap:0}
.tab-btn{padding:10px 18px;font-size:13px;color:#888;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab-btn:hover:not(.active){color:#333}
.tab-add{padding:8px 12px;font-size:20px;color:#ccc;border:none;background:none;line-height:1}
.tab-add:hover{color:#888}

/* ── GRID ── */
.grid-wrap{padding:var(--gap)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);align-items:start}
.project-card{position:relative;overflow:hidden;cursor:pointer;background:#f0f0f0}
.project-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.project-card:hover img{transform:scale(1.03)}
.card-overlay{position:absolute;bottom:0;left:0;right:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:12px;font-weight:500;opacity:0;transition:opacity .2s}
.project-card:hover .card-overlay{opacity:1}
.card-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;min-height:120px}

/* aspect ratios */
.ar-portrait{aspect-ratio:3/4}
.ar-square{aspect-ratio:1/1}
.ar-wide{aspect-ratio:2/1}
.ar-pano{aspect-ratio:3/1}

/* edit mode card overlays */
.edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
body.edit-mode .project-card:hover .edit-overlay{display:flex}
.eo-btn{padding:6px 14px;border:none;border-radius:4px;font-size:12px;font-weight:600}
.eo-edit{background:#fff;color:#222}
.eo-del{background:rgba(255,50,50,.8);color:#fff}
.add-card{background:#f7f7f7;border:2px dashed #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#ccc;aspect-ratio:1/1;transition:all .15s}
.add-card:hover{border-color:#aaa;color:#888;background:#f0f0f0}

/* ── EDIT TOOLBAR ── */
.edit-toolbar{background:#1a1a1a;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.et-label{font-size:12px;color:#888;flex-shrink:0}
.et-input{background:#2a2a2a;border:1px solid #444;color:#fff;padding:5px 10px;border-radius:4px;font-size:13px;font-family:inherit;outline:none;min-width:160px}
.et-input:focus{border-color:var(--accent)}
.et-spacer{flex:1}
.et-btn{padding:6px 14px;border-radius:4px;font-size:12px;border:none}
.et-save{background:var(--accent);color:#fff}
.et-exit{background:#333;color:#aaa}
.et-save:hover{background:#0088dd}
.et-exit:hover{color:#fff}
.saved-flash{font-size:11px;color:#3FB950;opacity:0;transition:opacity .3s}
.saved-flash.on{opacity:1}

/* ── PROJECT MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;overflow-y:auto;padding:20px}
.modal-bg.open{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:#fff;max-width:900px;width:100%;border-radius:4px;overflow:hidden;margin:auto;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;background:none;border:none;color:#888;z-index:10;line-height:1}
.modal-close:hover{color:#222}
.modal-main-img{width:100%;max-height:65vh;object-fit:contain;background:#111;display:block}
.modal-thumbs{display:flex;gap:4px;padding:8px;background:#f7f7f7;overflow-x:auto}
.modal-thumb{width:60px;height:60px;object-fit:cover;cursor:pointer;border:2px solid transparent;border-radius:2px;flex-shrink:0;opacity:.7;transition:all .15s}
.modal-thumb.active,.modal-thumb:hover{border-color:var(--accent);opacity:1}
.modal-info{padding:16px 20px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px}
.modal-desc{font-size:14px;color:#555;line-height:1.6}
.modal-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:none;font-size:22px;padding:10px 14px;line-height:1}
.modal-nav:hover{background:rgba(0,0,0,.7)}
#modal-prev{left:0;border-radius:0 4px 4px 0}
#modal-next{right:0;border-radius:4px 0 0 4px}

/* ── EDIT PROJECT MODAL ── */
.ep-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center;padding:20px}
.ep-bg.open{display:flex}
.ep-box{background:#1e1e1e;color:#e0e0e0;width:100%;max-width:640px;border-radius:8px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
.ep-head{padding:14px 18px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.ep-head h3{font-size:15px;font-weight:600}
.ep-close{background:none;border:none;color:#888;font-size:22px;line-height:1}
.ep-close:hover{color:#fff}
.ep-body{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.ep-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:5px}
.ep-input{width:100%;background:#2a2a2a;border:1px solid #444;color:#e0e0e0;padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;outline:none}
.ep-input:focus{border-color:var(--accent)}
.ep-textarea{min-height:60px;resize:vertical}
.ep-row{display:flex;gap:8px;flex-wrap:wrap}
.ep-size-btn{padding:5px 12px;border:1px solid #444;background:#2a2a2a;color:#aaa;border-radius:4px;font-size:12px;transition:all .15s}
.ep-size-btn.active{border-color:var(--accent);color:var(--accent);background:#0a1f30}
.ep-size-btn:hover:not(.active){border-color:#888;color:#e0e0e0}

/* Drop zone */
.drop-zone{border:2px dashed #444;border-radius:6px;padding:20px;text-align:center;color:#888;font-size:13px;position:relative;cursor:pointer;transition:all .15s;min-height:80px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);color:var(--accent);background:#0a1f30}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-zone .dz-icon{font-size:24px}
.dz-preview{width:60px;height:60px;object-fit:cover;border-radius:3px;margin-top:6px}

/* Images list in editor */
.img-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.img-item{position:relative;width:70px}
.img-item img{width:70px;height:70px;object-fit:cover;border-radius:3px;display:block}
.img-item-del{position:absolute;top:-5px;right:-5px;background:#e33;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;padding:0}
.img-item-main{position:absolute;bottom:0;left:0;right:0;background:rgba(0,160,255,.8);color:#fff;font-size:9px;text-align:center;padding:1px}

.ep-footer{padding:12px 18px;border-top:1px solid #333;display:flex;gap:8px;justify-content:flex-end}
.ep-save{background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:4px;font-weight:600}
.ep-cancel{background:#333;color:#aaa;border:none;padding:8px 16px;border-radius:4px}
.ep-save:hover{background:#0088dd}
.ep-cancel:hover{color:#fff}
</style>
</head>
<body>

<!-- EDIT TOOLBAR (only in edit mode) -->
<div class="edit-toolbar" id="edit-toolbar" style="display:none">
  <span class="et-label">Имя:</span>
  <input class="et-input" id="et-name" placeholder="Mariia Filippova" style="width:160px">
  <span class="et-label" style="margin-left:8px">Подпись:</span>
  <input class="et-input" id="et-sub" placeholder="2D artist" style="width:120px">
  <span class="et-spacer"></span>
  <span class="saved-flash" id="saved-flash">✓ Сохранено</span>
  <button class="et-btn et-save" onclick="saveAll()">Сохранить</button>
  <button class="et-btn et-exit" onclick="exitEdit()">✕ Выйти из редактора</button>
</div>

<!-- HEADER -->
<div class="site-header">
  <div class="sh-top">
    <div>
      <div class="sh-name" id="disp-name">Mariia Filippova</div>
      <div class="sh-sub" id="disp-sub">2D artist</div>
    </div>
    <button class="sh-edit-btn" onclick="enterEdit()" id="edit-hint-btn">✏ Edit</button>
  </div>
  <div style="display:flex;align-items:center">
    <div class="tabs" id="tabs-bar"></div>
    <button class="tab-add" id="tab-add-btn" style="display:none" onclick="addTab()" title="Добавить таб">+</button>
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid" id="main-grid"></div>
</div>

<!-- PROJECT VIEW MODAL -->
<div class="modal-bg" id="project-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <button class="modal-nav" id="modal-prev" onclick="navModal(-1)">‹</button>
    <button class="modal-nav" id="modal-next" onclick="navModal(1)">›</button>
    <img class="modal-main-img" id="modal-main-img" src="" alt="">
    <div class="modal-thumbs" id="modal-thumbs"></div>
    <div class="modal-info">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-desc" id="modal-desc"></div>
    </div>
  </div>
</div>

<!-- EDIT PROJECT MODAL -->
<div class="ep-bg" id="ep-modal">
  <div class="ep-box">
    <div class="ep-head">
      <h3 id="ep-modal-title">Редактировать проект</h3>
      <button class="ep-close" onclick="closeEP()">×</button>
    </div>
    <div class="ep-body">
      <div>
        <div class="ep-label">Название</div>
        <input class="ep-input" id="ep-title" placeholder="Название проекта">
      </div>
      <div>
        <div class="ep-label">Категория (таб)</div>
        <select class="ep-input" id="ep-cat"></select>
      </div>
      <div>
        <div class="ep-label">Ширина (колонок)</div>
        <div class="ep-row" id="ep-cols">
          <button class="ep-size-btn" data-val="1">1</button>
          <button class="ep-size-btn" data-val="2">2</button>
          <button class="ep-size-btn" data-val="3">3</button>
          <button class="ep-size-btn" data-val="4">4</button>
          <button class="ep-size-btn" data-val="5">5</button>
        </div>
      </div>
      <div>
        <div class="ep-label">Пропорции</div>
        <div class="ep-row" id="ep-ar">
          <button class="ep-size-btn" data-val="ar-portrait">Портрет 3:4</button>
          <button class="ep-size-btn" data-val="ar-square">Квадрат 1:1</button>
          <button class="ep-size-btn" data-val="ar-wide">Широкий 2:1</button>
          <button class="ep-size-btn" data-val="ar-pano">Панорама 3:1</button>
        </div>
      </div>
      <div>
        <div class="ep-label">Главное изображение</div>
        <div class="drop-zone" id="ep-drop-main" ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event,'main')">
          <input type="file" accept="image/*" onchange="dzFile(event,'main')">
          <span class="dz-icon">🖼</span>
          <span>Перетащи картинку или нажми</span>
          <img class="dz-preview" id="ep-main-preview" src="" style="display:none">
        </div>
        <input class="ep-input" id="ep-main-url" placeholder="Или вставь URL (Google Drive / любой)" style="margin-top:6px" onblur="applyMainUrl()">
      </div>
      <div>
        <div class="ep-label">Дополнительные изображения (открываются по клику)</div>
        <div class="drop-zone" id="ep-drop-extra" ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event,'extra')">
          <input type="file" accept="image/*" multiple onchange="dzFile(event,'extra')">
          <span class="dz-icon">+</span>
          <span>Добавить ещё картинки</span>
        </div>
        <input class="ep-input" id="ep-extra-url" placeholder="Или URL → Enter для добавления" style="margin-top:6px" onkeydown="addExtraUrl(event)">
        <div class="img-list" id="ep-extra-list"></div>
      </div>
      <div>
        <div class="ep-label">Описание</div>
        <textarea class="ep-input ep-textarea" id="ep-desc" placeholder="Описание проекта..."></textarea>
      </div>
    </div>
    <div class="ep-footer">
      <button class="ep-cancel" onclick="closeEP()">Отмена</button>
      <button class="ep-save" onclick="saveProject()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────
var KEY = 'mf_data';
var S = {
  title: 'Mariia Filippova',
  subtitle: '2D artist',
  tabs: ['All','WoWS','Casual'],
  activeTab: 'All',
  projects: []
};

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw); if(d&&d.projects) S=d; }
  }catch(e){}
}

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ alert('Ошибка сохранения. Возможно, картинки занимают слишком много памяти.'); }
  var f=document.getElementById('saved-flash');
  f.classList.add('on');
  setTimeout(function(){f.classList.remove('on');},1500);
}

// ── URL HELPERS ───────────────────────────────────────────────
function gdrive(url){
  if(!url) return '';
  var m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=view&id='+m[1];
  return url;
}

// ── RENDER ────────────────────────────────────────────────────
var IS_EDIT = location.search.indexOf('edit')!==-1;
var editMode = IS_EDIT;

function renderHeader(){
  document.getElementById('disp-name').textContent = S.title||'';
  document.getElementById('disp-sub').textContent = S.subtitle||'';
  if(editMode){
    document.getElementById('et-name').value = S.title||'';
    document.getElementById('et-sub').value = S.subtitle||'';
    document.getElementById('edit-toolbar').style.display='flex';
    document.getElementById('edit-hint-btn').style.display='none';
    document.getElementById('tab-add-btn').style.display='block';
    document.body.classList.add('edit-mode');
  } else {
    document.getElementById('edit-toolbar').style.display='none';
    document.getElementById('edit-hint-btn').style.display='';
    document.getElementById('tab-add-btn').style.display='none';
    document.body.classList.remove('edit-mode');
  }
}

function renderTabs(){
  var bar=document.getElementById('tabs-bar');
  bar.innerHTML='';
  var allTabs=['All'].concat(S.tabs.filter(function(t){return t!=='All';}));
  allTabs.forEach(function(t){
    var btn=document.createElement('button');
    btn.className='tab-btn'+(S.activeTab===t?' active':'');
    btn.textContent=t;
    btn.onclick=function(){ S.activeTab=t; renderGrid(); renderTabs(); };
    if(editMode && t!=='All'){
      btn.ondblclick=function(e){
        e.stopPropagation();
        var nv=prompt('Переименовать таб:',t);
        if(nv&&nv.trim()){
          S.tabs=S.tabs.map(function(x){return x===t?nv.trim():x;});
          S.projects.forEach(function(p){if(p.category===t)p.category=nv.trim();});
          if(S.activeTab===t) S.activeTab=nv.trim();
          save(); renderTabs(); renderGrid();
        }
      };
    }
    bar.appendChild(btn);
  });
}

function renderGrid(){
  var grid=document.getElementById('main-grid');
  grid.innerHTML='';
  var filtered = S.activeTab==='All' ? S.projects : S.projects.filter(function(p){return p.category===S.activeTab;});

  filtered.forEach(function(p, vi){
    var card=document.createElement('div');
    card.className='project-card '+(p.ar||'ar-square');
    card.style.gridColumn='span '+(p.cols||1);

    var imgUrl = gdrive(p.coverUrl||'');
    if(imgUrl){
      var img=document.createElement('img');
      img.src=imgUrl;
      img.alt=p.title||'';
      card.appendChild(img);
    } else {
      var ph=document.createElement('div');
      ph.className='card-no-img';
      ph.textContent='+ Нет изображения';
      card.appendChild(ph);
    }

    if(p.title){
      var ov=document.createElement('div');
      ov.className='card-overlay';
      ov.textContent=p.title;
      card.appendChild(ov);
    }

    if(editMode){
      var eo=document.createElement('div');
      eo.className='edit-overlay';
      eo.innerHTML='<button class="eo-btn eo-edit">✏ Изменить</button><button class="eo-btn eo-del">✕ Удалить</button>';
      eo.querySelector('.eo-edit').onclick=function(e){e.stopPropagation();openEP(p.id);};
      eo.querySelector('.eo-del').onclick=function(e){e.stopPropagation();if(confirm('Удалить?')){S.projects=S.projects.filter(function(x){return x.id!==p.id;});save();renderGrid();}};
      card.appendChild(eo);
    } else {
      var allImgs = [p.coverUrl||''].concat(p.images||[]).filter(Boolean);
      if(allImgs.length>0){
        card.onclick=function(){ openModal(p.id,0); };
      }
    }
    grid.appendChild(card);
  });

  if(editMode){
    var add=document.createElement('div');
    add.className='add-card';
    add.textContent='+';
    add.onclick=function(){ openEP(null); };
    grid.appendChild(add);
  }
}

// ── EDIT MODE ─────────────────────────────────────────────────
function enterEdit(){
  editMode=true;
  renderHeader();
  renderTabs();
  renderGrid();
}
function exitEdit(){
  S.title=document.getElementById('et-name').value||S.title;
  S.subtitle=document.getElementById('et-sub').value||S.subtitle;
  save();
  editMode=false;
  renderHeader();
  renderTabs();
  renderGrid();
}
function saveAll(){
  S.title=document.getElementById('et-name').value||S.title;
  S.subtitle=document.getElementById('et-sub').value||S.subtitle;
  document.getElementById('disp-name').textContent=S.title;
  document.getElementById('disp-sub').textContent=S.subtitle;
  save();
}
function addTab(){
  var name=prompt('Название нового таба:');
  if(name&&name.trim()){
    if(S.tabs.indexOf(name.trim())===-1) S.tabs.push(name.trim());
    save(); renderTabs();
  }
}

// ── EDIT PROJECT MODAL ─────────────────────────────────────────
var epId=null, epMain='', epExtra=[];

function openEP(id){
  epId=id;
  var p = id ? S.projects.find(function(x){return x.id===id;}) : null;
  epMain = p ? (p.coverUrl||'') : '';
  epExtra = p ? (p.images||[]).slice() : [];

  document.getElementById('ep-modal-title').textContent = id ? 'Редактировать проект' : 'Новый проект';
  document.getElementById('ep-title').value = p ? (p.title||'') : '';
  document.getElementById('ep-desc').value = p ? (p.desc||'') : '';
  document.getElementById('ep-main-url').value = epMain;

  // category select
  var sel=document.getElementById('ep-cat');
  sel.innerHTML='';
  var allTabs=['All'].concat(S.tabs.filter(function(t){return t!=='All';}));
  allTabs.forEach(function(t){
    var opt=document.createElement('option');
    opt.value=t; opt.textContent=t;
    if(p&&p.category===t) opt.selected=true;
    sel.appendChild(opt);
  });

  // cols
  document.querySelectorAll('#ep-cols .ep-size-btn').forEach(function(b){
    b.classList.toggle('active', String(p&&p.cols||1)===b.dataset.val);
    b.onclick=function(){
      document.querySelectorAll('#ep-cols .ep-size-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
    };
  });

  // aspect ratio
  document.querySelectorAll('#ep-ar .ep-size-btn').forEach(function(b){
    b.classList.toggle('active', (p&&p.ar||'ar-square')===b.dataset.val);
    b.onclick=function(){
      document.querySelectorAll('#ep-ar .ep-size-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
    };
  });

  renderMainPreview();
  renderExtraList();
  document.getElementById('ep-modal').classList.add('open');
}

function closeEP(){ document.getElementById('ep-modal').classList.remove('open'); }

function renderMainPreview(){
  var prev=document.getElementById('ep-main-preview');
  if(epMain){ prev.src=gdrive(epMain); prev.style.display='block'; }
  else { prev.style.display='none'; }
}

function renderExtraList(){
  var list=document.getElementById('ep-extra-list');
  list.innerHTML='';
  epExtra.forEach(function(url,i){
    var item=document.createElement('div');
    item.className='img-item';
    item.innerHTML='<img src="'+gdrive(url)+'" alt=""><button class="img-item-del" onclick="removeExtra('+i+')">×</button>';
    list.appendChild(item);
  });
}

function removeExtra(i){ epExtra.splice(i,1); renderExtraList(); }

function applyMainUrl(){
  var v=document.getElementById('ep-main-url').value.trim();
  if(v){ epMain=v; renderMainPreview(); }
}

function addExtraUrl(e){
  if(e.key==='Enter'){
    var v=e.target.value.trim();
    if(v){ epExtra.push(v); e.target.value=''; renderExtraList(); }
  }
}

function saveProject(){
  var title=document.getElementById('ep-title').value.trim();
  var desc=document.getElementById('ep-desc').value.trim();
  var cat=document.getElementById('ep-cat').value;
  var colsBtn=document.querySelector('#ep-cols .ep-size-btn.active');
  var arBtn=document.querySelector('#ep-ar .ep-size-btn.active');
  var cols=colsBtn?parseInt(colsBtn.dataset.val):1;
  var ar=arBtn?arBtn.dataset.val:'ar-square';

  if(epId){
    var p=S.projects.find(function(x){return x.id===epId;});
    if(p){ p.title=title; p.desc=desc; p.category=cat; p.cols=cols; p.ar=ar; p.coverUrl=epMain; p.images=epExtra.slice(); }
  } else {
    S.projects.push({id:'p'+Date.now(),title:title,desc:desc,category:cat,cols:cols,ar:ar,coverUrl:epMain,images:epExtra.slice()});
  }
  save();
  renderGrid();
  closeEP();
}

// ── DRAG & DROP ───────────────────────────────────────────────
function dzOver(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function dzLeave(e){ e.currentTarget.classList.remove('over'); }
function dzDrop(e,type){
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  var files=e.dataTransfer.files;
  if(!files.length) return;
  if(type==='main') readFile(files[0], function(url){ epMain=url; document.getElementById('ep-main-url').value=''; renderMainPreview(); });
  else { for(var i=0;i<files.length;i++) (function(f){ readFile(f,function(url){ epExtra.push(url); renderExtraList(); }); })(files[i]); }
}
function dzFile(e,type){
  var files=e.target.files;
  if(!files.length) return;
  if(type==='main') readFile(files[0], function(url){ epMain=url; document.getElementById('ep-main-url').value=''; renderMainPreview(); });
  else { for(var i=0;i<files.length;i++) (function(f){ readFile(f,function(url){ epExtra.push(url); renderExtraList(); }); })(files[i]); }
}
function readFile(file, cb){
  var r=new FileReader();
  r.onload=function(e){ cb(e.target.result); };
  r.readAsDataURL(file);
}

// ── VIEW MODAL ────────────────────────────────────────────────
var modalPid=null, modalImgIdx=0, visibleProjects=[];

function openModal(id, imgIdx){
  var p=S.projects.find(function(x){return x.id===id;});
  if(!p) return;
  modalPid=id;
  visibleProjects = S.activeTab==='All' ? S.projects : S.projects.filter(function(x){return x.category===S.activeTab;});
  showModalProject(p, imgIdx||0);
  document.getElementById('project-modal').classList.add('open');
}

function showModalProject(p, imgIdx){
  var allImgs=[p.coverUrl||''].concat(p.images||[]).filter(Boolean).map(gdrive);
  if(!allImgs.length) return;
  modalImgIdx=Math.max(0,Math.min(imgIdx,allImgs.length-1));
  document.getElementById('modal-main-img').src=allImgs[modalImgIdx];
  document.getElementById('modal-title').textContent=p.title||'';
  document.getElementById('modal-desc').textContent=p.desc||'';
  var thumbs=document.getElementById('modal-thumbs');
  thumbs.innerHTML='';
  allImgs.forEach(function(url,i){
    var img=document.createElement('img');
    img.src=url; img.className='modal-thumb'+(i===modalImgIdx?' active':'');
    img.onclick=function(){ showModalProject(p,i); };
    thumbs.appendChild(img);
  });
  thumbs.style.display=allImgs.length>1?'flex':'none';
}

function closeModal(){ document.getElementById('project-modal').classList.remove('open'); }

function navModal(dir){
  var idx=visibleProjects.findIndex(function(x){return x.id===modalPid;});
  var next=visibleProjects[(idx+dir+visibleProjects.length)%visibleProjects.length];
  if(next){ modalPid=next.id; showModalProject(next,0); }
}

document.getElementById('project-modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.addEventListener('keydown',function(e){
  if(document.getElementById('project-modal').classList.contains('open')){
    if(e.key==='Escape') closeModal();
    if(e.key==='ArrowLeft') navModal(-1);
    if(e.key==='ArrowRight') navModal(1);
  }
  if(document.getElementById('ep-modal').classList.contains('open') && e.key==='Escape') closeEP();
});

// ── INIT ──────────────────────────────────────────────────────
load();
if(IS_EDIT) editMode=true;
renderHeader();
renderTabs();
renderGrid();
</script>
